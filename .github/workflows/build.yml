name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: TLauncher-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/release/app-release.apk TLauncher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TLauncher.apk \
            --title "TLauncher (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download **TLauncher.apk** below and open it on the head unit to install." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
